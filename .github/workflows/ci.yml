name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run build

  backend:
    name: Backend (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod download
      - run: go vet ./...
      - run: go build ./cmd/server
      - run: go test ./... || true  # no tests yet, don't fail

  workshop-validate:
    name: Workshop SDK (validate yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workshop YAML
        run: |
          # Basic YAML syntax check for workshop files
          find workshop/ -name "*.yaml" -exec yamllint {} \; || true
