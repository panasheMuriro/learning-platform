# Docker Compose for local development of the course platform.
#
# This is a dev fallback — the primary distribution is via the Workshop SDK.
# Use this when you want to run the frontend + backend without building the SDK.
#
# NOTE: The backend's PTY terminal and lab grading require access to LXD + Juju
# on the host. For full lab functionality, use `workshop launch` instead.
# This compose file is for frontend/backend development only.
#
# Usage:
#   docker compose up --build
#   # Frontend: http://localhost:3000
#   # Backend:  http://localhost:8080
#   # Postgres: localhost:5432

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./platform/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Mount course content for live editing
      - ./content:/content:ro
      # Mount a lab working directory
      - lab-data:/home/student
    environment:
      - DB_DSN=postgres://course:course@db:5432/course?sslmode=disable
    command:
      ["./server", "--addr", ":8080", "--content-root", "/content", "--lab-root", "/home/student", "--db-dsn", "postgres://course:course@db:5432/course?sslmode=disable"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./platform/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://localhost:8080/api

volumes:
  pg-data:
  lab-data:
