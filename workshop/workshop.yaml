# Workshop course definition for the course platform.
#
# Learners run: workshop launch
# This launches a Workshop with the course-platform SDK,
# which bundles Juju, Terraform, LXD, Postgres, the frontend, backend,
# and all course content (auto-discovered from content/courses/).
#
# The course web UI is exposed at http://localhost:8080 via the tunnel slot.

name: course-platform
base: ubuntu@24.04
sdks:
  - name: course-platform
    channel: try/stable
