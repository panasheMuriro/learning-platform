# Workshop SDK: course-platform
#
# Bundles everything needed for the course platform:
#   - Juju (snap) — base toolset for the juju-terraform course
#   - Terraform
#   - LXD (pre-initialized)
#   - Postgres (for progress tracking + course registry)
#   - Backend (Go API server with GORM, serves content/quiz/grading/progress)
#   - Frontend (React SPA, @canonical/react-components + xterm.js + Monaco)
#   - Course content (all courses under content/courses/)
#
# This is a GENERIC platform SDK — it bundles the platform + base tools.
# Each course declares its required tools in course.json. The backend
# auto-discovers courses at startup via the registry.
#
# Based on the Ollama SDK pattern: https://github.com/canonical/ollama-sdk
# SDKcraft docs: https://ubuntu.com/workshop/docs

name: course-platform
adopt-info: juju
title: Course Platform
summary: Hands-on course platform with in-browser labs and auto-grading
description: |
  A complete local environment for hands-on courses. Includes a browser-based
  course platform (frontend + backend + Postgres) with in-browser terminal,
  code editor, and file tree. Courses are auto-discovered from the content
  directory — add a new course dir and it appears in the catalog.

  Everything runs locally — no cloud or remote hosting required.
  Learners run `workshop launch` and open localhost in their browser.

  ## Key components

  - `juju`: Juju OLM CLI (snap) — base toolset
  - `terraform`: Terraform CLI (>= 1.6)
  - `lxd`: LXD container manager (pre-initialized with lxdbr0)
  - `postgres`: PostgreSQL for progress tracking + course registry
  - `course-backend`: Go API server (content, quiz, grading, progress) with GORM
  - `course-frontend`: React SPA (@canonical/react-components + xterm.js + Monaco)
  - Course content: all courses under content/courses/ (auto-discovered)

  ## Setup actions

  On launch, the SDK:
  - Adds juju, terraform, and lxd to PATH via /etc/profile.d
  - Initializes LXD with lxdbr0 bridge and ZFS storage
  - Initializes and starts Postgres
  - Starts the course backend as a systemd user service on port 8080
    (auto-migrates the DB, discovers courses, serves the API + frontend)
  - Exposes port 8080 to the host browser via a tunnel slot

license: Apache-2.0
website: https://github.com/juju-tf-course/juju-tf-course
platforms:
  ubuntu@24.04:amd64:

# Slots: resources this SDK provides to the host
slots:
  # Expose the course web UI (frontend + API) to the host browser.
  course-web:
    interface: tunnel
    endpoint: 8080

# Parts: how to build/install each component
parts:
  # Install Juju via snap
  juju:
    plugin: nil
    override-build: |
      craftctl default
      snap download juju --basename=juju
      unsquashfs -d juju-squashfs juju.snap
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cp juju-squashfs/bin/juju "$CRAFT_PART_INSTALL/bin/juju"
      chmod +x "$CRAFT_PART_INSTALL/bin/juju"
      JUJU_VERSION=$(sed -n 's/^version: *//p' juju-squashfs/meta/snap.yaml | tr -d "'\"")
      craftctl set version="${JUJU_VERSION:-unknown}"
    build-packages:
      - squashfs-tools

  # Install Terraform
  terraform:
    plugin: nil
    override-build: |
      TF_VERSION="1.9.8"
      ARCH=$(dpkg --print-architecture)
      case "$ARCH" in
        amd64) TF_ARCH="amd64" ;;
        arm64) TF_ARCH="arm64" ;;
        *) TF_ARCH="amd64" ;;
      esac
      curl -fLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_${TF_ARCH}.zip"
      unzip -o "terraform_${TF_VERSION}_linux_${TF_ARCH}.zip"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cp terraform "$CRAFT_PART_INSTALL/bin/terraform"
      chmod +x "$CRAFT_PART_INSTALL/bin/terraform"
    build-packages:
      - unzip
      - curl

  # Build the backend (Go).
  # We download the Go toolchain tarball directly instead of using the go
  # snap: the snap is classic-confinement and channel "1.22" no longer
  # exists (Go snap channels are now 1.25/1.26/latest). A pinned tarball is
  # more reproducible anyway, matching the juju/terraform parts above.
  backend:
    plugin: nil
    source: ../platform/backend
    source-type: local
    build-packages:
      - curl
    override-build: |
      GO_VERSION="1.22.10"
      ARCH=$(dpkg --print-architecture)
      curl -fLO "https://go.dev/dl/go${GO_VERSION}.linux-${ARCH}.tar.gz"
      tar -C /tmp -xzf "go${GO_VERSION}.linux-${ARCH}.tar.gz"
      cd "$CRAFT_PART_SRC"
      /tmp/go/bin/go build -o "$CRAFT_PART_INSTALL/bin/course-server" ./cmd/server

  # Build the frontend (static files)
  frontend:
    plugin: nil
    source: ../platform/frontend
    source-type: local
    build-packages:
      - nodejs
      - npm
    override-build: |
      npm install -g bun
      cd "$CRAFT_PART_SRC"
      bun install
      bun run build
      mkdir -p "$CRAFT_PART_INSTALL/share/course-frontend"
      cp -r dist/* "$CRAFT_PART_INSTALL/share/course-frontend/"

  # Install Postgres
  postgres:
    plugin: nil
    build-packages:
      - postgresql
    override-build: |
      # Postgres is installed via apt (build-packages). We just need to ensure
      # the binaries are available in the SDK's bin directory.
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      for bin in initdb pg_ctl psql postgres pg_isready; do
        ln -sf "/usr/lib/postgresql/16/bin/$bin" "$CRAFT_PART_INSTALL/bin/$bin"
      done

  # Copy course content (all courses under content/courses/)
  content:
    plugin: dump
    source: ../content
    source-type: local
    organize:
      "*": share/course-content/

  # Install systemd service files
  services:
    plugin: dump
    source: services
    source-type: local
    organize:
      "*": services/
